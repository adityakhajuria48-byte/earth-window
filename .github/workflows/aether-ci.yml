name: AETHER CI

on:
  push:
    branches: ["aether/mvp"]
    paths:
      - "aether/**"
      - ".github/workflows/aether-ci.yml"
  pull_request:
    paths:
      - "aether/**"
      - ".github/workflows/aether-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aether
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: aether/pyproject.toml
      - name: Install AETHER and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest tests -q
      - name: Run benchmark smoke test
        run: python -m aether.cli benchmark --size 128 --repeats 2 --backend numpy
