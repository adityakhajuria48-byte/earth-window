name: Globe browser verification
on:
  pull_request:
    paths: ['dist/**', 'validation/check_globe.py', '.github/workflows/globe-browser.yml']
permissions:
  contents: read
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright pillow
      - run: python validation/check_globe.py
