name: Preview pixel verification
on:
  pull_request:
    paths: ['crops.py', 'validation/check_preview_pixels.py', '.github/workflows/preview-pixels.yml']
permissions:
  contents: read
jobs:
  pixels:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-raster.txt
      - run: python -m unittest test_preview_ranges test_crops
      - run: python validation/check_preview_pixels.py
