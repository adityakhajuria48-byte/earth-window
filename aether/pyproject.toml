[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-earth-observation"
version = "0.1.0"
description = "Reproducible CPU/GPU kernels and benchmarks for Earth-observation rasters"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
raster = ["rasterio>=1.3"]
torch = ["torch>=2.1"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["aether*"]

[tool.pytest.ini_options]
testpaths = ["aether/tests"]
python_files = ["test_*.py"]
